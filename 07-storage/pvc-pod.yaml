apiVersion: v1
kind: Pod
metadata:
  name: writer
spec:
  containers:
    - name: writer
      image: busybox:1.38.0
      command: ['sh', '-c', 'date -u > /data/created-at.txt && sleep 3600']
      volumeMounts:
        - name: scratch
          mountPath: /data
  volumes:
    - name: scratch
      persistentVolumeClaim:
        claimName: scratch
