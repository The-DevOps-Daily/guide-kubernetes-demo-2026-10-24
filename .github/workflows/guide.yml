name: Guide runs

# Runs every part of the guide on a fresh kind cluster and keeps the output of each command
# as an artifact. A second job checks every manifest against a real API server.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      parts:
        description: 'Parts to run, as a JSON list such as ["03","04"] (empty runs all)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - id: parts
        env:
          PARTS: ${{ inputs.parts }}
        run: |
          if [ -z "$PARTS" ]; then
            PARTS='["01","02","03","04","05","06","07","08","09","10"]'
          fi
          echo "parts=$PARTS" >> "$GITHUB_OUTPUT"

  part:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kind, kubectl and helm
        run: scripts/install-tools.sh

      - name: Install cosign
        if: matrix.part == '10'
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          curl -fsSLO https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          curl -fsSLO https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign_checksums.txt
          grep ' cosign-linux-amd64$' cosign_checksums.txt | sha256sum -c
          sudo install -m 0755 cosign-linux-amd64 /usr/local/bin/cosign

      - name: Run part ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: scripts/run.sh "$PART"

      - name: Keep the output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-${{ matrix.part }}
          path: captures/
          retention-days: 30

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install kind, kubectl and helm
        run: scripts/install-tools.sh
      - name: Check every manifest with a server-side dry run
        run: scripts/validate.sh
