# Reject containers without an explicit image tag or digest, and the :latest tag
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: pinned-images
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ['']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['pods']
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.contains('@sha256:') ||
          (c.image.split('/')[c.image.split('/').size() - 1].contains(':') &&
           !c.image.endsWith(':latest')))
      messageExpression: >-
        'every container image needs a version tag or digest, and not :latest: ' +
        variables.containers.map(c, c.image).join(', ')
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: pinned-images
spec:
  policyName: pinned-images
  validationActions: ['Deny']
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: demo
