# Valkey's own configuration file, from a ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-config
data:
  valkey.conf: |
    maxmemory 64mb
    maxmemory-policy allkeys-lru
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  labels:
    app: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          args: ['/etc/valkey/valkey.conf'] # start valkey-server with this file
          ports:
            - name: valkey
              containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: cache-config
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  labels:
    app: cache
spec:
  selector:
    app: cache
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
