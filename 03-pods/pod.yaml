apiVersion: v1
kind: Pod
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  containers:
    - name: podinfo
      image: ghcr.io/stefanprodan/podinfo:6.15.0
      ports:
        - name: http
          containerPort: 9898
      # Send traffic only when the app says it is ready
      readinessProbe:
        httpGet:
          path: /readyz
          port: http
        periodSeconds: 5
      # Restart the container if the app stops answering
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 10
        failureThreshold: 3
