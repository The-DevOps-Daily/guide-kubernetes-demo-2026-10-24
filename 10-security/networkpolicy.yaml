# 1. Deny all incoming traffic to every pod in the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ['Ingress']
---
# 2. podinfo accepts HTTP from pods labeled role=client in this namespace,
#    from the gateway-infra namespace and from Prometheus (Part 9)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo-ingress
spec:
  podSelector:
    matchLabels:
      app: podinfo
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: client
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-infra
        # namespace AND pod label in one entry: only the Prometheus pods in monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9898
---
# 3. The cache accepts connections only from podinfo
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cache-ingress
spec:
  podSelector:
    matchLabels:
      app: cache
  policyTypes: ['Ingress']
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: podinfo
      ports:
        - protocol: TCP
          port: 6379
