# External Secrets Operator: copies a value from an external store into a Kubernetes Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cache-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault # a ClusterSecretStore that points at your secret store
  target:
    name: cache-auth # the Secret it creates and keeps up to date
  data:
    - secretKey: password
      remoteRef:
        key: demo/cache
        property: password
