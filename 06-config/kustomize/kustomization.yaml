apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
configMapGenerator:
  # Creates podinfo-config-<hash>; the hash changes whenever the data changes
  - name: podinfo-config
    literals:
      - PODINFO_UI_MESSAGE=Hello from Kustomize
      - PODINFO_LEVEL=info
    files:
      - features.yaml
