apiVersion: v1
kind: Pod
metadata:
  name: batch-task
spec:
  # Allowed onto nodes with the dedicated=batch:NoSchedule taint ...
  tolerations:
    - key: dedicated
      operator: Equal
      value: batch
      effect: NoSchedule
  # ... and required to run on a node labelled workload=batch
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values: ['batch']
  containers:
    - name: task
      image: busybox:1.38.0
      command: ['sleep', '3600']
