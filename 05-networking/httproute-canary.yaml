# The same route, now splitting traffic 90/10 between stable and canary
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo
spec:
  parentRefs:
    - name: public
      namespace: gateway-infra
  hostnames:
    - podinfo.k8s-guide.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: podinfo
          port: 80
          weight: 90
        - name: podinfo-canary
          port: 80
          weight: 10
